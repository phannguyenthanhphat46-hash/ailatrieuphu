<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI LÀ TRIỆU PHÚ — Người chơi</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#173a86,#07142f 65%);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:28px;box-shadow:0 15px 40px rgba(0,0,0,.28)}h1{font-family:Georgia,serif;text-align:center;color:#ffd33d;font-size:42px;margin:5px 0 8px}.sub{text-align:center;opacity:.82;margin-bottom:22px}.panel{max-width:780px;margin:0 auto}.hidden{display:none!important}.status,.note{text-align:center}.status{font-size:18px;margin:14px 0}.players{margin-top:16px;padding:15px;background:rgba(255,255,255,.08);border-radius:12px}.qr{background:#fff;padding:12px;border-radius:14px;width:max-content;margin:14px auto}.hostLink{word-break:break-all;text-align:center;font-size:14px;opacity:.8}.big{font-size:90px;text-align:center;color:#ffd33d;font-weight:900;margin:22px}.timer{font-size:52px;text-align:center;color:#ffd33d;font-weight:900}.q{font-size:28px;font-weight:800;line-height:1.4;margin:18px 0}.answers{display:grid;gap:12px}.answer{width:100%;padding:15px;border:0;border-radius:12px;background:#173b86;color:#fff;text-align:left;font-size:18px;font-weight:700;cursor:pointer}.answer:disabled{cursor:default}.answer.selected{outline:3px solid #ffd33d;background:#2457b5}.submitbtn{width:100%;padding:15px;border:0;border-radius:12px;font-size:18px;font-weight:800;background:#ffd33d;color:#07142f;cursor:pointer;margin-top:10px}.submitbtn:disabled{opacity:.45;cursor:not-allowed}.controls button,.joinbtn{width:100%;padding:15px;border:0;border-radius:12px;font-size:18px;font-weight:800;background:#ffd33d;color:#07142f;cursor:pointer;margin-top:10px}.controls button:disabled{opacity:.45;cursor:not-allowed}input{width:100%;padding:15px;border:0;border-radius:12px;font-size:18px;margin:8px 0;color:#111}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:11px;border-bottom:1px solid rgba(255,255,255,.15);text-align:center}th{color:#ffd33d}.rank1{font-size:24px;color:#ffd33d}.ok{background:#198754!important}.bad{background:#b02a37!important}.info{padding:12px;border-radius:10px;background:rgba(255,255,255,.08);margin-top:14px}
</style></head><body><div class="wrap"><div class="card"><h1>AI LÀ TRIỆU PHÚ</h1><div class="sub">Trò chơi tương tác cùng cả lớp</div>
<section id="join" class="panel"><h2>👤 THAM GIA</h2><input id="name" maxlength="30" placeholder="Nhập tên của bạn"><button id="joinBtn" class="joinbtn">VÀO TRÒ CHƠI</button><div id="status" class="status"></div></section>
<section id="count" class="hidden panel"><div id="countNum" class="big">5</div><div class="note">Chuẩn bị...</div></section>
<section id="game" class="hidden panel"><div id="timer" class="timer">15</div><div id="qno" class="note"></div><div id="question" class="q"></div><div id="answers" class="answers"></div><button id="submitBtn" class="submitbtn" disabled>XÁC NHẬN NỘP</button><div id="reveal" class="status"></div></section>
<section id="roundResults" class="hidden panel"><h2 style="text-align:center">📊 KẾT QUẢ CÂU VỪA RỒI</h2><div id="roundTitle" class="note"></div><table><thead><tr><th>Hạng</th><th>Tên</th><th>Thời gian</th><th>Điểm câu</th><th>Tổng điểm</th></tr></thead><tbody id="roundBoard"></tbody></table></section>
<section id="results" class="hidden panel"><h2 style="text-align:center">🏆 TỔNG KẾT BẢNG XẾP HẠNG</h2><table><thead><tr><th>Hạng</th><th>Tên</th><th>Tổng điểm</th></tr></thead><tbody id="board"></tbody></table></section>
</div></div><script>
const QUESTIONS=[["Theo triết học Mác – Lênin, bản chất con người được hiểu là gì?", ["Bản chất sinh học thuần túy", "Bản chất tinh thần bất biến", "Tổng hòa các quan hệ xã hội", "Do số phận quyết định"], 2], ["Quan niệm triết học Mác – Lênin về “Tự do” là gì?", ["Làm bất cứ điều gì mình muốn", "Nhận thức và hành động theo quy luật khách quan", "Không chịu bất kỳ giới hạn nào", "Sống tách khỏi xã hội"], 1], ["Tự do của cá nhân có quan hệ thế nào với xã hội?", ["Hoàn toàn tách biệt", "Chỉ phụ thuộc vào ý muốn cá nhân", "Được thực hiện trong những điều kiện xã hội nhất định", "Không liên quan đến người khác"], 2], ["Mối quan hệ giữa con người và hoàn cảnh xã hội được hiểu thế nào?", ["Con người hoàn toàn bị hoàn cảnh quyết định", "Hoàn cảnh không ảnh hưởng con người", "Con người vừa chịu tác động vừa cải tạo hoàn cảnh", "Con người tồn tại độc lập với xã hội"], 2], ["Nếu không có các quan hệ xã hội, con người sẽ như thế nào?", ["Vẫn phát triển đầy đủ như một con người xã hội", "Không thể phát triển đầy đủ bản chất xã hội", "Trở nên hoàn toàn tự do", "Không chịu ảnh hưởng nào"], 1], ["Câu thành ngữ hoặc tục ngữ nào thể hiện vai trò của hoàn cảnh?", ["Có công mài sắt, có ngày nên kim", "Đi một ngày đàng, học một sàng khôn", "Gần mực thì đen, gần đèn thì sáng", "Uống nước nhớ nguồn"], 2], ["Câu ca dao hoặc tục ngữ nào thể hiện vai trò của con người trong việc tự quyết định?", ["Cha mẹ sinh con, trời sinh tính", "Có chí thì nên", "Đói cho sạch, rách cho thơm", "Ăn quả nhớ kẻ trồng cây"], 1], ["Yếu tố nào giúp con người phát huy tự do một cách hiện thực?", ["Nhận thức và cải tạo hoàn cảnh", "Chỉ dựa vào may mắn", "Tách khỏi xã hội", "Không cần tuân theo quy luật"], 0], ["Chọn câu hoàn chỉnh chứa các từ Hán – Việt phù hợp.", ["Con người là tổng hòa những quan hệ xã hội", "Con người là sản phẩm của xã hội", "Con người là chủ thể của lịch sử", "Cả ba ý trên"], 3], ["Quan niệm cho rằng “số phận đã được định sẵn” trái với quan điểm nào?", ["Con người không thể thay đổi gì", "Con người có khả năng lựa chọn và hành động trong những điều kiện nhất định", "Xã hội không ảnh hưởng cá nhân", "Mọi thứ đều do may rủi"], 1]];const QUESTION_MS=15000;
const u=new URL(location.href);let HOST_ID='';try{HOST_ID=new URLSearchParams(location.hash.replace(/^#/,'')).get('h')||''}catch(e){}if(!HOST_ID)HOST_ID=u.searchParams.get('h')||'';try{HOST_ID=decodeURIComponent(HOST_ID)}catch(e){}
const join=document.getElementById('join'),statusEl=document.getElementById('status'),count=document.getElementById('count'),game=document.getElementById('game'),results=document.getElementById('results'),roundResults=document.getElementById('roundResults'),timerEl=document.getElementById('timer'),qno=document.getElementById('qno'),questionEl=document.getElementById('question'),answersEl=document.getElementById('answers'),revealEl=document.getElementById('reveal'),submitBtn=document.getElementById('submitBtn'),joinBtn=document.getElementById('joinBtn');
let peer=null,conn=null,myName='',timer=null,answered=false,myOffset=0,currentI=-1,currentDeadline=0,selectedAnswer=-1,retryTimer=null,connectTimeout=null,heartbeatTimer=null,manualJoin=false,retryCount=0,joining=false;
const KEY='ai_trieu_phu_player_id_v3';let playerId=localStorage.getItem(KEY);if(!playerId){playerId=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);localStorage.setItem(KEY,playerId)}
function now(){return Date.now()+myOffset}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setStatus(t){statusEl.textContent=t}
function clearTimers(){clearTimeout(retryTimer);clearTimeout(connectTimeout);clearInterval(heartbeatTimer)}
function showCountdown(at){join.classList.add('hidden');count.classList.remove('hidden');game.classList.add('hidden');results.classList.add('hidden');roundResults.classList.add('hidden');clearInterval(timer);const tick=()=>{const l=Math.max(0,Number(at)-now());document.getElementById('countNum').textContent=Math.max(1,Math.ceil(l/1000));if(l<=0)clearInterval(timer)};timer=setInterval(tick,50);tick()}
function showQ(i,st){if(!QUESTIONS[i])return;currentI=Number(i);currentDeadline=Number(st)+QUESTION_MS;count.classList.add('hidden');game.classList.remove('hidden');results.classList.add('hidden');roundResults.classList.add('hidden');answered=false;selectedAnswer=-1;submitBtn.disabled=true;revealEl.textContent='';const q=QUESTIONS[i];qno.textContent=`Câu ${i+1}/${QUESTIONS.length}`;questionEl.textContent=q[0];answersEl.innerHTML='';q[1].forEach((x,j)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+j)+'. '+x;b.onclick=()=>selectAnswer(i,j,b);answersEl.appendChild(b)});runTimer(currentDeadline,i)}
function runTimer(deadline,i){clearInterval(timer);const tick=()=>{const l=Math.max(0,deadline-now());timerEl.textContent=Math.ceil(l/1000);if(l<=0){clearInterval(timer);if(!answered)answer(i,-1);reveal(i)}};timer=setInterval(tick,50);tick()}
function reveal(i){if(!QUESTIONS[i])return;const q=QUESTIONS[i];[...answersEl.children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('ok')});revealEl.textContent='✅ Đáp án đúng: '+String.fromCharCode(65+q[2])}
function selectAnswer(i,j,b){if(answered||i!==currentI)return;selectedAnswer=j;[...answersEl.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');submitBtn.disabled=false}
function answer(i,j){if(answered||i!==currentI)return;answered=true;[...answersEl.children].forEach(x=>x.disabled=true);submitBtn.disabled=true;const correct=j>=0&&j===QUESTIONS[i][2],elapsedMs=Math.max(0,Math.min(QUESTION_MS,now()-(currentDeadline-QUESTION_MS))),points=correct?Math.max(100,2000-Math.min(1900,Math.round(elapsedMs/10))):0;try{if(conn&&conn.open)conn.send({type:'ANSWER',playerId,name:myName,question:i,answer:j,correct,elapsedMs})}catch(e){}}
function renderRoundBoard(scores,answers,i){const names=Object.keys(scores||{}).sort((a,b)=>{const sa=scores[a]?.score||0,sb=scores[b]?.score||0;if(sb!==sa)return sb-sa;return(answers?.[a]?.elapsedMs??Infinity)-(answers?.[b]?.elapsedMs??Infinity)});document.getElementById('roundTitle').textContent=`Sau câu ${i+1}: xếp hạng hiện tại`;document.getElementById('roundBoard').innerHTML=names.map((n,k)=>{const r=answers?.[n],ms=r?.elapsedMs==null?'—':(Number(r.elapsedMs)/1000).toFixed(2)+'s';return `<tr><td class="${k===0?'rank1':''}">${k+1}</td><td>${esc(n)}</td><td>${ms}</td><td>${r?.points||0}</td><td>${scores[n]?.score||0}</td></tr>`}).join('')||'<tr><td colspan="5">Chưa có dữ liệu</td></tr>';roundResults.classList.remove('hidden');game.classList.add('hidden');count.classList.add('hidden');results.classList.add('hidden')}
function renderBoard(scores){const rows=Object.keys(scores||{}).sort((a,b)=>(scores[b]?.score||0)-(scores[a]?.score||0));document.getElementById('board').innerHTML=rows.map((n,i)=>`<tr><td class="${i===0?'rank1':''}">${i+1}</td><td>${esc(n)}</td><td>${scores[n]?.score||0}</td></tr>`).join('')||'<tr><td colspan="3">Chưa có dữ liệu</td></tr>'}
function sendJoin(){if(!conn||!conn.open)return false;try{conn.send({type:'JOIN',playerId,name:myName,clientTime:Date.now()});conn.send({type:'SYNC',playerId,clientSent:Date.now()});return true}catch(e){return false}}
function retry(){if(!manualJoin||!HOST_ID)return;clearTimeout(retryTimer);retryCount=Math.min(20,retryCount+1);retryTimer=setTimeout(connect,Math.min(6000,800+retryCount*350))}
function fail(msg){joining=false;setStatus(msg);try{if(conn)conn.close()}catch(e){}try{if(peer&&!peer.destroyed)peer.destroy()}catch(e){}conn=null;peer=null;retry()}
function connect(){if(!manualJoin||!HOST_ID||joining)return;joining=true;clearTimers();try{if(conn)conn.close()}catch(e){}try{if(peer&&!peer.destroyed)peer.destroy()}catch(e){}conn=null;peer=null;setStatus(retryCount?'🔄 Đang tự kết nối lại với quản trò...':'⏳ Đang kết nối với quản trò...');
try{peer=new Peer(undefined,{debug:0,host:'0.peerjs.com',port:443,path:'/',secure:true,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun.cloudflare.com:3478'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}]}})}catch(e){joining=false;retry();return}
peer.on('open',()=>{try{conn=peer.connect(HOST_ID,{reliable:true,serialization:'json'})}catch(e){fail('🟠 Không mở được kết nối tới quản trò — đang thử lại...');return}connectTimeout=setTimeout(()=>{if(!conn||!conn.open)fail('🟠 Quản trò chưa phản hồi — đang thử lại...')},12000);
conn.on('open',()=>{joining=false;clearTimeout(connectTimeout);sendJoin();setStatus('🟡 Đã kết nối — đang xác nhận tên...');clearInterval(heartbeatTimer);heartbeatTimer=setInterval(()=>{if(!conn||!conn.open){retry();return}try{conn.send({type:'PING',playerId,clientNow:Date.now()});if(!joinConfirmed)sendJoin()}catch(e){}},5000)});
let joinConfirmed=false;
conn.on('data',d=>{if(!d||typeof d!=='object')return;if(d.type==='PING'){try{conn.send({type:'PONG',hostNow:d.hostNow,clientNow:Date.now()})}catch(e){}return}if(d.type==='PONG'||d.type==='SYNC_OK'){if(d.clientSent&&Number.isFinite(Number(d.hostNow))){const a=Number(d.clientSent),b=Date.now();myOffset=Number(d.hostNow)-((a+b)/2)}return}if(d.type==='HELLO'){if(Number.isFinite(Number(d.hostNow)))myOffset=Number(d.hostNow)-Date.now();sendJoin();return}if(d.type==='WELCOME'){clearTimeout(connectTimeout);joinConfirmed=true;retryCount=0;if(d.name)myName=d.name;setStatus('🟢 Đã tham gia! Tên đã được quản trò xác nhận.');if(d.gameFinished){clearInterval(timer);roundResults.classList.add('hidden');game.classList.add('hidden');count.classList.add('hidden');results.classList.remove('hidden');renderBoard(d.scores||{});return}if(d.gameStarted&&d.current>=0)showQ(d.current,d.currentStartAt);else if(d.gameStarted&&d.current<0)showCountdown(d.currentStartAt);return}if(d.type==='START')showCountdown(d.startAt);else if(d.type==='Q')showQ(d.i,d.startAt);else if(d.type==='ROUND_RESULTS'){clearInterval(timer);if(Number(d.i)===currentI)reveal(d.i);renderRoundBoard(d.scores,d.answers,d.i)}else if(d.type==='RESULTS'){clearInterval(timer);roundResults.classList.add('hidden');game.classList.add('hidden');count.classList.add('hidden');results.classList.remove('hidden');renderBoard(d.scores||{})}});
conn.on('close',()=>{clearTimers();conn=null;joinConfirmed=false;joining=false;if(manualJoin){setStatus('🟠 Mất kết nối với quản trò — đang tự kết nối lại...');retry()}});conn.on('error',()=>{if(manualJoin&&!joinConfirmed)fail('🟠 Kết nối bị gián đoạn — đang thử lại...')})});
peer.on('disconnected',()=>{if(manualJoin)try{peer.reconnect()}catch(e){retry()}});peer.on('error',e=>{if(manualJoin){console.error(e);fail(e?.type==='peer-unavailable'?'🟠 Không tìm thấy quản trò — hãy quét QR mới nhất.':(e?.type==='network'||e?.type==='server-error'||e?.type==='socket-error'||e?.type==='socket-closed'?'🟠 Máy chủ kết nối đang bận/mất mạng — đang tự thử lại...':'🟠 PeerJS: '+(e?.type||'unknown')+' — đang thử lại...'))}});peer.on('close',()=>{joining=false;if(manualJoin&&!joinConfirmed)retry()})}
if(!HOST_ID){setStatus('⚠️ Hãy quét QR của quản trò để tham gia.');joinBtn.disabled=true}else setStatus('📱 QR hợp lệ — nhập tên rồi bấm VÀO TRÒ CHƠI.');
joinBtn.onclick=()=>{const entered=document.getElementById('name').value.trim();if(!entered){setStatus('⚠️ Hãy nhập tên trước.');return}if(!HOST_ID){setStatus('⚠️ QR không chứa mã quản trò. Hãy quét lại QR mới.');return}myName=entered.slice(0,30);manualJoin=true;retryCount=0;joinBtn.disabled=true;connect()}
submitBtn.onclick=()=>{if(selectedAnswer>=0)answer(currentI,selectedAnswer)}
</script></body></html>
